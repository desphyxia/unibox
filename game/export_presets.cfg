html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-title\" content=\"Meadow\"><script>(function(){function fit(){var c=document.getElementById('canvas');if(!c)return;var v=window.visualViewport;var w=v?v.width:window.innerWidth,h=v?v.height:window.innerHeight;var r=Math.min(window.devicePixelRatio||1,2);var pw=Math.round(w*r),ph=Math.round(h*r);var st=c.style;if(st.position!=='fixed'){st.position='fixed';st.left='0px';st.top='0px';}if(st.width!==w+'px'){st.width=w+'px';}if(st.height!==h+'px'){st.height=h+'px';}if(c.width!==pw)c.width=pw;if(c.height!==ph)c.height=ph;if(window.scrollX||window.scrollY)window.scrollTo(0,0);}window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);if(window.visualViewport){window.visualViewport.addEventListener('resize',fit);}document.addEventListener('DOMContentLoaded',fit);setInterval(fit,250);})();</script>"
